name: Cloudflare Pages dashboard
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-pages.mjs'
      - '.github/workflows/pages.yml'
      - 'package.json'
      - 'specs/**'
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate static dashboard
        env:
          MCP_PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL }}
        run: npm run pages:build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-pages --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
