name: GitHub Pages dashboard
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/pages.yml'
      - 'package.json'
      - 'specs/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build standalone dashboard
        run: npm run pages:build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Package Pages artifact without unpinned composite action
        run: tar --dereference --hard-dereference -cvf github-pages.tar -C dist-pages .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: github-pages.tar
          retention-days: 1
          compression-level: 0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
