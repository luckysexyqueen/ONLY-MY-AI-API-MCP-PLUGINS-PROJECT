name: MCP Server Runtime Check
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'requirements.txt'
      - 'specs/**'
      - '.github/workflows/run-mcp-server.yml'
permissions:
  contents: read
jobs:
  mcp-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Start server and verify
        env:
          MCP_BEARER_TOKEN: github-actions-test-token
          ALLOWED_API_HOSTS: ''
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn server.app:app --host 127.0.0.1 --port 8080 > /tmp/mcp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/mcp-server.log' EXIT
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /tmp/mcp-health.json; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          python - <<'PY'
          import json,urllib.request
          with open('/tmp/mcp-health.json') as f: health=json.load(f)
          assert health['status']=='ok',health
          for method in ('initialize','tools/list'):
              payload=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':{}}).encode()
              request=urllib.request.Request('http://127.0.0.1:8080/mcp',data=payload,headers={'Content-Type':'application/json','Authorization':'Bearer github-actions-test-token'})
              with urllib.request.urlopen(request,timeout=10) as response: result=json.load(response)
              assert 'result' in result,result
              if method=='tools/list':
                  assert any(t['name']=='list_api_operations' for t in result['result']['tools'])
              print(method,'OK')
          PY
